<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escape Game: Das Geraden-Labor</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f7;--card:#fff;--tx:#1d2433;--mu:#5d667a;--bd:#d3d9e8;--ac:#6a3fe0;--ok:#1b8a4b;--okb:#e3f6ea;--no:#c0392b;--nob:#fde8e5;--gd:#b57b00;--gdb:#fff4d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#191e33;--tx:#e8ebf4;--mu:#9aa3b8;--bd:#2c3454;--ac:#a58bff;--ok:#5fd68f;--okb:#17301f;--no:#ff8a7a;--nob:#3a1d1a;--gd:#ffc14d;--gdb:#3a2f12}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#191e33;--tx:#e8ebf4;--mu:#9aa3b8;--bd:#2c3454;--ac:#a58bff;--ok:#5fd68f;--okb:#17301f;--no:#ff8a7a;--nob:#3a1d1a;--gd:#ffc14d;--gdb:#3a2f12}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:1.45rem;margin:0 0 2px}h2{font-size:1.2rem;margin:0 0 6px}
.sub{color:var(--mu);margin:0 0 14px;font-size:.92rem}
.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;margin-bottom:14px;font-weight:600;font-size:.92rem}
.story{background:var(--gdb);border:1px solid var(--gd);border-radius:14px;padding:14px;margin-bottom:14px}
.tip{background:var(--card);border:1px dashed var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.9rem;color:var(--mu)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.q.done{border-color:var(--ok)}
.tag{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ac)}
.q p{margin:4px 0 10px;font-weight:600}
.o{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.no{background:var(--nob);border-color:var(--no)}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit}
.b{padding:10px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
.b:disabled{opacity:.5}
.hb{margin-top:6px;border:0;background:transparent;color:var(--ac);font:inherit;cursor:pointer;padding:4px 0}
.msg{margin-top:8px;padding:9px 12px;border-radius:10px;font-size:.93rem;display:none}
.msg.h{display:block;background:var(--gdb)}.msg.ok{display:block;background:var(--okb)}.msg.no{display:block;background:var(--nob)}
.door{background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:14px;margin-top:6px}
.slots{display:flex;gap:10px;margin:10px 0}
.slot{width:48px;height:56px;border:2px solid var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700}
.slot.on{border-color:var(--ok);background:var(--okb)}
.fin{text-align:center;background:var(--card);border:2px solid var(--ok);border-radius:14px;padding:22px}
</style>
</head>
<body>
<div class="w">
<h1>🔐 Das Geraden-Labor</h1>
<p class="sub">Escape Game · Mathe 9. Klasse Realschule Bayern (Zweig IIIa) · Geradengleichungen aufstellen</p>
<div class="bar"><span id="room"></span><span id="time"></span><span id="stat"></span></div>
<div id="main"></div>
</div>
<script>
// o[0] ist immer richtig (wird gemischt). d = Code-Ziffer, ord = Reihenfolge der Ziffern an der Tür.
var R=[
{n:"Raum 1: Der Eingangsflur",s:"Du bist im Labor von Professorin Steigung eingeschlossen! Die Tür fällt ins Schloss. Nur wer die Geradengleichungen versteht, findet den Türcode. Löse die vier Rätsel.",ord:[3,1,4,2],p:[
{ic:"🖼️",t:"Das Gemälde",q:"Auf dem Bilderrahmen steht eine Formel. Wie lautet die allgemeine Form einer Geradengleichung?",o:["y = m·x + t","y = m + x·t","y = x² + t","y = t·x − m·t"],h:"m ist die Steigung, t der y-Achsenabschnitt.",e:"y = m·x + t.",d:4},
{ic:"🧰",t:"Die Truhe",q:"Das Schloss der Truhe fragt: Welche Steigung hat y = 3x − 2?",o:["m = 3","m = −2","m = 2","m = ⅓"],h:"Die Zahl direkt vor dem x.",e:"m = 3.",d:7},
{ic:"🕰️",t:"Die Wanduhr",q:"Wo schneidet die Gerade y = −½x + 4 die y-Achse?",o:["(0 | 4)","(4 | 0)","(0 | −½)","(−½ | 4)"],h:"Setze x = 0 ein.",e:"Bei x = 0 ist y = t = 4, also (0 | 4).",d:2},
{ic:"🗝️",t:"Das Zahlenschloss",q:"Welcher Punkt liegt auf der Geraden y = 2x + 1?",o:["(2 | 5)","(1 | 2)","(0 | 2)","(3 | 6)"],h:"Setze die x-Koordinate ein und vergleiche mit y.",e:"2·2 + 1 = 5 ✓ (Punktprobe).",d:9}]},
{n:"Raum 2: Die Bibliothek",s:"Die Tür springt auf – doch hinter ihr liegt die Bibliothek mit der nächsten verschlossenen Tür. Hier brauchst du Steigungsdreiecke und Punktproben.",ord:[2,4,1,3],p:[
{ic:"📖",t:"Das Rechenbuch",q:"Berechne die Steigung der Geraden durch A(1 | 2) und B(3 | 8).",o:["m = 3","m = 2","m = 6","m = ⅓"],h:"m = (y₂ − y₁) ÷ (x₂ − x₁)",e:"m = (8 − 2) ÷ (3 − 1) = 3.",d:1},
{ic:"📜",t:"Die Schriftrolle",q:"Eine Gerade mit m = 2 geht durch P(3 | 4). Wie lautet ihre Gleichung?",o:["y = 2x − 2","y = 2x + 4","y = 2x + 2","y = 2x − 6"],h:"Setze P und m in y = mx + t ein und löse nach t.",e:"4 = 2·3 + t → t = −2.",d:8},
{ic:"🔭",t:"Das Fernrohr",q:"Stelle die Gleichung der Geraden durch A(2 | 1) und B(4 | 7) auf.",o:["y = 3x − 5","y = 3x + 1","y = 3x − 1","y = 2x − 3"],h:"Erst m, dann t mit einem der beiden Punkte.",e:"m = (7 − 1) ÷ (4 − 2) = 3; 1 = 3·2 + t → t = −5.",d:3},
{ic:"🪞",t:"Der Spiegel",q:"Stelle die Gleichung der Geraden durch A(0 | −1) und B(2 | 3) auf.",o:["y = 2x − 1","y = 4x − 1","y = 2x + 1","y = ½x − 1"],h:"A liegt auf der y-Achse – so kennst du t sofort.",e:"m = (3 + 1) ÷ (2 − 0) = 2; t = −1.",d:5}]},
{n:"Raum 3: Der Tresorraum",s:"Letzter Raum! Hinter dem Tresor liegt der Ausgang ins Freie. Die Rätsel sind jetzt knifflig – lass dich nicht verwirren.",ord:[3,1,2],p:[
{ic:"💎",t:"Die Vitrine",q:"Stelle die Gleichung der Geraden durch A(−1 | 5) und B(2 | −1) auf.",o:["y = −2x + 3","y = −2x + 5","y = 2x + 7","y = −3x + 2"],h:"Erst m berechnen, dann t per Punktprobe. Achtung bei den Vorzeichen!",e:"m = (−1 − 5) ÷ (2 + 1) = −2; 5 = −2·(−1) + t → t = 3.",d:6},
{ic:"🚕",t:"Der Taxameter",q:"Ein Taxi kostet 3 € Grundgebühr plus 2 € pro km (y = 2x + 3). Wie viele km kann man für 25 € fahren?",num:11,h:"Setze y = 25 ein und löse nach x.",e:"25 = 2x + 3 → x = 11 km.",d:2},
{ic:"🔢",t:"Das Tresorschloss",q:"Der Punkt P(k | 7) liegt auf der Geraden y = 2x − 3. Bestimme k.",num:5,h:"Setze y = 7 ein und löse nach k.",e:"7 = 2k − 3 → k = 5.",d:4}]}
];
var ri=0,S,mist=0,hints=0,t0=Date.now(),tm,finished=false;
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function code(r){return r.ord.map(function(k){return r.p[k-1].d}).join("")}
function head(){document.getElementById("room").textContent=finished?"🏁 Geschafft":"🚪 Raum "+(ri+1)+" / "+R.length;
 document.getElementById("stat").textContent="❌ "+mist+"  💡 "+hints}
function tick(){if(!finished)document.getElementById("time").textContent="⏱ "+fmt(Date.now()-t0)}
function room(){
 var r=R[ri],m=document.getElementById("main");m.innerHTML="";S=r.p.map(function(){return false});head();
 var st=document.createElement("div");st.className="story";st.innerHTML="<h2>"+r.n+"</h2>"+r.s;m.appendChild(st);
 if(ri===0){var tp=document.createElement("div");tp.className="tip";tp.innerHTML="<b>Merkhilfe:</b> y = m·x + t &nbsp;|&nbsp; m = (y₂ − y₁) ÷ (x₂ − x₁) &nbsp;|&nbsp; t per Punktprobe";m.appendChild(tp)}
 r.p.forEach(function(p,i){
  var c=document.createElement("div");c.className="q";
  c.innerHTML='<span class="tag">'+p.ic+" Rätsel "+(i+1)+" · "+p.t+"</span><p>"+p.q+"</p>";
  var msg=document.createElement("div");msg.className="msg";var hb=document.createElement("button");hb.className="hb";hb.textContent="💡 Hinweis zeigen";var used=false;
  hb.onclick=function(){if(S[i])return;if(!used){used=true;hints++;head()}msg.className="msg h";msg.textContent="💡 "+p.h};
  function win(){S[i]=true;c.className="q done";hb.style.display="none";msg.className="msg ok";msg.innerHTML="✅ Gelöst! "+p.e+" <b>Gefundene Ziffer: "+p.d+" 🔑</b>";c.querySelectorAll("button.o,button.b,input").forEach(function(x){x.disabled=true});slots()}
  function lose(){mist++;head();msg.className="msg no";msg.textContent="❌ Das passt nicht – versuch es nochmal (oder nutze den Hinweis)."}
  if(p.num===undefined){shuf([0,1,2,3]).forEach(function(k){var b=document.createElement("button");b.className="o";b.textContent=p.o[k];
   b.onclick=function(){if(k===0){b.classList.add("ok");win()}else{b.classList.add("no");b.disabled=true;lose()}};c.appendChild(b)})}
  else{var w=document.createElement("div");w.className="row";w.innerHTML='<input inputmode="decimal" placeholder="Antwort"><button class="b">Prüfen</button>';
   var inp=w.querySelector("input"),bt=w.querySelector("button");
   function chk(){if(S[i])return;var v=parseFloat(inp.value.replace(",","."));if(isNaN(v))return;if(Math.abs(v-p.num)<1e-9)win();else lose()}
   bt.onclick=chk;inp.onkeydown=function(e){if(e.key==="Enter")chk()};c.appendChild(w)}
  c.appendChild(hb);c.appendChild(msg);m.appendChild(c)});
 var d=document.createElement("div");d.className="door";
 d.innerHTML='<b>🚪 Die Tür</b><br><span style="color:var(--mu);font-size:.92rem">Die Ziffern stehen in dieser Reihenfolge der Rätsel: <b>'+r.ord.join(" · ")+'</b></span><div class="slots" id="slots"></div><div class="row"><input id="ci" inputmode="numeric" maxlength="'+r.ord.length+'" placeholder="'+r.ord.length+'-stelliger Code"><button class="b" id="cb">Tür öffnen</button></div><div class="msg" id="cm"></div>';
 m.appendChild(d);
 document.getElementById("cb").onclick=open;document.getElementById("ci").onkeydown=function(e){if(e.key==="Enter")open()};slots()}
function slots(){var r=R[ri],s=document.getElementById("slots");s.innerHTML="";
 r.ord.forEach(function(k){var e=document.createElement("div");e.className="slot"+(S[k-1]?" on":"");e.textContent=S[k-1]?r.p[k-1].d:"?";s.appendChild(e)})}
function open(){var r=R[ri],v=document.getElementById("ci").value.trim(),cm=document.getElementById("cm");
 if(v===code(r)){if(ri<R.length-1){ri++;room();window.scrollTo(0,0)}else end()}
 else{mist++;head();cm.className="msg no";cm.textContent="🔒 Falscher Code. Hast du alle Rätsel gelöst und die Reihenfolge beachtet?"}}
function end(){finished=true;head();var ms=Date.now()-t0,n=mist+hints*0,m=document.getElementById("main");
 var rate=mist===0&&hints===0?"🏆 Perfekt – ganz ohne Fehler und Hinweise!":mist<=3?"🌟 Sehr stark gemacht!":"👍 Geschafft! Mit etwas Übung wird es noch schneller.";
 m.innerHTML='<div class="fin"><h2>🎉 Du bist entkommen!</h2><p>Zeit: <b>'+fmt(ms)+'</b> · Fehlversuche: <b>'+mist+'</b> · Hinweise: <b>'+hints+'</b></p><p>'+rate+'</p><button class="b" id="again">Nochmal spielen</button></div>';
 document.getElementById("again").onclick=function(){ri=0;mist=0;hints=0;finished=false;t0=Date.now();room();window.scrollTo(0,0)}}
tm=setInterval(tick,1000);tick();room();
</script>
</body>
</html>
